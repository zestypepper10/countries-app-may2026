
<!-- Declaring the document type as HTML5 -->


<!doctype html>

<html lang="en">

<head>
  <!-- Sets character encoding so the page supports most characters -->
  <meta charset="UTF-8" />

  <!-- Sets the favicon (small icon shown in the browser tab) -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Makes the page responsive on different screen sizes -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Preconnect helps the browser load Google Fonts faster -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Imports the Nunito Sans font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;600;800&display=swap" rel="stylesheet" />

  <!-- Title shown in the browser tab -->
  <title>Countries App</title>
</head>

<body>
  <!-- Root element where the React app will be rendered -->
  <div id="root"></div>

  <!-- Main JavaScript file that starts the React app -->
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
